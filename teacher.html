<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة المعلم - المدرّس الشقي</title>
    
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- LOAD CONNECTION FROM INIT.JS -->
    <script src="init.js"></script>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { cairo: ['Cairo', 'sans-serif'] },
                    colors: {
                        lesson: '#10B981', // Emerald
                        revision: '#8B5CF6', // Violet
                        exam: '#EF4444', // Red
                        brand: '#4F46E5', // Indigo
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Cairo', sans-serif; }
        
        /* Table Styles */
        .gradebook-table th, .gradebook-table td {
            padding: 0.75rem;
            white-space: nowrap;
        }

        /* PRINT STYLES */
        @media print {
            @page { size: landscape; margin: 0.5cm; }
            body { background: white !important; -webkit-print-color-adjust: exact; margin: 0; }
            
            /* Hide UI Elements */
            nav, #view-creator, .no-print, button, .context-selector-area { display: none !important; }
            
            /* Show Gradebook */
            #view-gradebook { display: block !important; width: 100%; margin: 0; padding: 0; }
            
            /* Table Styling for Paper */
            table { width: 100%; border-collapse: collapse; font-size: 11px; }
            th, td { border: 1px solid #000 !important; color: #000 !important; padding: 4px; }
            th { background-color: #f3f3f3 !important; font-weight: bold; }
            
            /* Header for Print */
            .print-header { display: block !important; text-align: center; margin-bottom: 15px; border-bottom: 2px solid black; padding-bottom: 10px; }
        }
        
        .print-header { display: none; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen pb-20">

    <!-- 1. NAVBAR -->
    <nav class="bg-white border-b shadow-sm sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            
            <!-- Logo & Context -->
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2">
                    <span class="text-2xl">👨‍🏫</span>
                    <span class="font-bold text-gray-800 hidden md:block">لوحة المعلم</span>
                </div>
                
                <!-- Context Dropdown -->
                <div class="relative group context-selector-area">
                    <select id="context-select" class="bg-gray-100 border-0 text-gray-800 text-sm font-bold rounded-lg focus:ring-2 focus:ring-brand block w-full p-2.5 pr-8 cursor-pointer min-w-[200px]">
                        <option value="">جاري التحميل...</option>
                    </select>
                </div>
            </div>

            <!-- Tab Buttons -->
            <div class="flex gap-2">
                <button onclick="switchView('creator')" id="btn-creator" class="bg-brand text-white px-4 py-2 rounded-lg text-sm font-bold shadow-md hover:bg-indigo-700 transition flex items-center gap-2">
                    <span>📝</span> <span class="hidden sm:inline">إنشاء محتوى</span>
                </button>
                <button onclick="switchView('gradebook')" id="btn-gradebook" class="bg-gray-100 text-gray-600 hover:bg-gray-200 px-4 py-2 rounded-lg text-sm font-bold transition flex items-center gap-2">
                    <span>📊</span> <span class="hidden sm:inline">سجل الدرجات</span>
                </button>
            </div>

            <!-- Logout -->
            <button onclick="logout()" class="text-red-500 font-bold text-sm hover:bg-red-50 px-3 py-2 rounded-lg transition">
                خروج
            </button>
        </div>
    </nav>

    <!-- 2. CREATOR SECTION -->
    <div id="view-creator" class="container mx-auto p-4 max-w-4xl transition-opacity duration-300">
        
        <!-- Header -->
        <div class="mb-6">
            <h1 class="text-2xl font-black text-gray-800">إعداد درس جديد</h1>
            <p class="text-gray-500 text-sm">قم بملء البيانات الأساسية ثم أضف الأسئلة.</p>
        </div>

        <!-- Metadata Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <!-- Title -->
                <div class="col-span-1 md:col-span-2">
                    <label class="block text-sm font-bold text-gray-700 mb-2">عنوان الدرس / الاختبار</label>
                    <input type="text" id="lessonTitle" placeholder="مثال: شرح نظرية فيثاغورس" 
                        class="w-full border-2 border-gray-200 rounded-xl p-3 focus:border-brand focus:ring-0 outline-none font-bold">
                </div>

                <!-- Term Select -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">الترم الدراسي</label>
                    <select id="termSelect" class="w-full border-2 border-gray-200 rounded-xl p-3 focus:border-brand outline-none bg-white">
                        <!-- Filled via JS -->
                    </select>
                </div>

                <!-- Order Index -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">رقم الترتيب (Level)</label>
                    <input type="number" id="orderIndex" value="1" min="1" 
                        class="w-full border-2 border-gray-200 rounded-xl p-3 focus:border-brand outline-none font-bold">
                </div>
            </div>

            <!-- Type Selection (Radios) -->
            <div class="mt-6">
                <label class="block text-sm font-bold text-gray-700 mb-3">نوع المحتوى</label>
                <div class="grid grid-cols-3 gap-4">
                    <!-- Lesson -->
                    <label class="cursor-pointer">
                        <input type="radio" name="lessonType" value="lesson" class="peer sr-only" checked>
                        <div class="border-2 border-gray-200 rounded-xl p-4 text-center hover:bg-gray-50 peer-checked:border-green-500 peer-checked:bg-green-50 transition-all">
                            <div class="text-2xl mb-1">⭐</div>
                            <div class="font-bold text-gray-700 peer-checked:text-green-700">درس</div>
                            <div class="text-[10px] text-gray-400">مكافأة: نجمة</div>
                        </div>
                    </label>
                    
                    <!-- Revision -->
                    <label class="cursor-pointer">
                        <input type="radio" name="lessonType" value="revision" class="peer sr-only">
                        <div class="border-2 border-gray-200 rounded-xl p-4 text-center hover:bg-gray-50 peer-checked:border-purple-500 peer-checked:bg-purple-50 transition-all">
                            <div class="text-2xl mb-1">🔮</div>
                            <div class="font-bold text-gray-700 peer-checked:text-purple-700">مراجعة</div>
                            <div class="text-[10px] text-gray-400">مكافأة: كريستالة</div>
                        </div>
                    </label>

                    <!-- Exam -->
                    <label class="cursor-pointer">
                        <input type="radio" name="lessonType" value="exam" class="peer sr-only">
                        <div class="border-2 border-gray-200 rounded-xl p-4 text-center hover:bg-gray-50 peer-checked:border-red-500 peer-checked:bg-red-50 transition-all">
                            <div class="text-2xl mb-1">💎</div>
                            <div class="font-bold text-gray-700 peer-checked:text-red-700">امتحان</div>
                            <div class="text-[10px] text-gray-400">مكافأة: جوهرة</div>
                        </div>
                    </label>
                </div>
            </div>
        </div>
        
        <!-- Content Builder -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-lg text-gray-800">أسئلة المحتوى (Question & Answer)</h3>
            </div>

            <div id="linksContainer" class="space-y-4 mb-6">
                <!-- Rows injected here -->
                <div class="text-center text-gray-400 py-4 border-2 border-dashed rounded-xl" id="emptyState">
                    اضغط "إضافة سؤال" للبدء
                </div>
            </div>
            
            <button onclick="addLink()" class="w-full border-2 border-dashed border-gray-300 hover:border-brand hover:text-brand text-gray-500 font-bold py-3 rounded-xl transition flex justify-center items-center gap-2">
                <span>➕ إضافة سؤال جديد</span>
            </button>
        </div>
        
        <!-- Save Actions -->
        <div class="mt-8 flex justify-end gap-4">
            <button onclick="saveLesson()" id="saveBtn" class="bg-brand hover:bg-indigo-700 text-white font-bold px-8 py-3 rounded-xl shadow-lg shadow-indigo-200 transform active:scale-95 transition flex items-center gap-2">
                <span>حفظ ونشر</span>
                <span id="saveIcon">💾</span>
            </button>
        </div>
    </div>

    <!-- 3. GRADEBOOK SECTION (Hidden by default) -->
    <div id="view-gradebook" class="hidden container mx-auto p-4 max-w-7xl">
        
        <!-- Print Header (Visible only when printing) -->
        <div class="print-header">
            <h1 class="text-2xl font-bold">تقرير درجات الطلاب - المدرّس الشقي</h1>
            <p id="printContextTitle" class="text-sm mt-1"></p>
            <p class="text-xs mt-1">تاريخ التقرير: <span id="printDate"></span></p>
        </div>

        <!-- Screen Header -->
        <div class="flex justify-between items-center mb-6 no-print">
            <div>
                <h1 class="text-2xl font-black text-gray-800">سجل الدرجات 📊</h1>
                <p class="text-gray-500 text-sm" id="gradebookSubtitle">اختر مادة لعرض النتائج</p>
            </div>
            <div class="flex gap-2">
                <button onclick="window.print()" class="bg-gray-800 hover:bg-black text-white px-4 py-2 rounded-lg font-bold flex items-center gap-2 transition">
                    <span>🖨️ طباعة</span>
                </button>
                <button onclick="exportCSV()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg font-bold transition">
                    <span>Excel</span>
                </button>
            </div>
        </div>

        <!-- The Table Container -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-x-auto">
            <table class="w-full text-sm text-right gradebook-table">
                <thead class="bg-indigo-50 text-indigo-900 border-b-2 border-indigo-100">
                    <tr id="tableHeaderRow">
                        <th class="sticky right-0 bg-indigo-50 font-bold min-w-[200px] text-right pr-6">اسم الطالب</th>
                        <th class="text-center">المجموع</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="divide-y divide-gray-100 text-gray-700 font-medium">
                    <tr><td colspan="100" class="p-8 text-center text-gray-500">جاري التحميل...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- MAIN LOGIC -->
    <script type="module">
        import { APP_CONFIG, GRADES, SUBJECTS, TERMS } from './config.js';
        
        // 1. SETUP SUPABASE (Via init.js)
        const supabase = window.supabaseClient;

        // 2. STATE
        let currentUser = null;
        let currentContext = null; // e.g. "grade_5_primary_math"

        // 3. INIT
        window.addEventListener('load', async () => {
            // A. Check Auth
            const userStr = localStorage.getItem('tb_user');
            if (!userStr) return kickOut();
            
            currentUser = JSON.parse(userStr);
            if (!['teacher', 'admin'].includes(currentUser.role)) return kickOut();

            // B. Populate Terms
            const termSelect = document.getElementById('termSelect');
            TERMS.forEach(term => {
                const opt = document.createElement('option');
                opt.value = term.id;
                opt.innerText = term.name;
                termSelect.appendChild(opt);
            });

            // C. Populate Context Dropdown (Allowed Teaching)
            const contextSelect = document.getElementById('context-select');
            contextSelect.innerHTML = '';
            const subscriptions = currentUser.subscriptions || {};
            const keys = Object.keys(subscriptions);

            if (keys.length === 0) {
                contextSelect.innerHTML = '<option>لا توجد مواد مخصصة</option>';
            } else {
                keys.forEach(key => {
                    const grade = GRADES.find(g => key.startsWith(g.id));
                    if (grade) {
                        const subjectId = key.replace(grade.id + '_', '');
                        const subject = SUBJECTS.find(s => s.id === subjectId);
                        if (subject) {
                            const opt = document.createElement('option');
                            opt.value = key;
                            opt.innerText = `${grade.short_name} - ${subject.name}`;
                            contextSelect.appendChild(opt);
                        }
                    }
                });
            }

            // D. Set Initial Context
            if (contextSelect.options.length > 0) {
                currentContext = contextSelect.value;
            }

            // E. Listeners
            contextSelect.addEventListener('change', (e) => {
                currentContext = e.target.value;
                // If on gradebook view, reload data
                if (!document.getElementById('view-gradebook').classList.contains('hidden')) {
                    loadGradebook();
                }
            });
        });

        // ==========================================
        // VIEW SWITCHING
        // ==========================================
        window.switchView = (viewName) => {
            const creator = document.getElementById('view-creator');
            const gradebook = document.getElementById('view-gradebook');
            const btnCreator = document.getElementById('btn-creator');
            const btnGradebook = document.getElementById('btn-gradebook');

            if (viewName === 'creator') {
                creator.classList.remove('hidden');
                gradebook.classList.add('hidden');
                
                // Active State Styling
                btnCreator.classList.add('bg-brand', 'text-white');
                btnCreator.classList.remove('bg-gray-100', 'text-gray-600');
                btnGradebook.classList.remove('bg-brand', 'text-white');
                btnGradebook.classList.add('bg-gray-100', 'text-gray-600');

            } else {
                creator.classList.add('hidden');
                gradebook.classList.remove('hidden');

                // Active State Styling
                btnGradebook.classList.add('bg-brand', 'text-white');
                btnGradebook.classList.remove('bg-gray-100', 'text-gray-600');
                btnCreator.classList.remove('bg-brand', 'text-white');
                btnCreator.classList.add('bg-gray-100', 'text-gray-600');
                
                loadGradebook();
            }
        };

        // ==========================================
        // CREATOR FUNCTIONS
        // ==========================================
        window.addLink = () => {
            const container = document.getElementById('linksContainer');
            const emptyState = document.getElementById('emptyState');
            if (emptyState) emptyState.remove();

            const id = Date.now();
            const div = document.createElement('div');
            div.className = 'bg-gray-50 p-4 rounded-xl border border-gray-200 relative group transition-all hover:border-brand';
            div.id = `link-${id}`;

            div.innerHTML = `
                <div class="absolute top-2 left-2 opacity-0 group-hover:opacity-100 transition">
                    <button onclick="removeLink('${id}')" class="text-red-500 hover:text-red-700 font-bold p-1 bg-white rounded shadow">🗑️</button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">السؤال (Trigger)</label>
                        <textarea class="w-full border rounded-lg p-2 text-sm focus:border-brand outline-none row-trigger" rows="2" placeholder="اكتب السؤال هنا..."></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">الإجابة (Response)</label>
                        <textarea class="w-full border rounded-lg p-2 text-sm focus:border-brand outline-none row-response" rows="2" placeholder="الإجابة الصحيحة..."></textarea>
                    </div>
                </div>
            `;
            container.appendChild(div);
        };

        window.removeLink = (id) => document.getElementById(`link-${id}`).remove();

        window.saveLesson = async () => {
            const saveBtn = document.getElementById('saveBtn');
            const saveIcon = document.getElementById('saveIcon');
            
            if (!currentContext) return alert('يرجى اختيار المادة والصف أولاً.');
            
            const title = document.getElementById('lessonTitle').value.trim();
            if (!title) return alert('يرجى كتابة عنوان الدرس.');

            const termId = document.getElementById('termSelect').value;
            const type = document.querySelector('input[name="lessonType"]:checked').value;
            const orderIndex = document.getElementById('orderIndex').value;

            const rows = [];
            const triggers = document.querySelectorAll('.row-trigger');
            const responses = document.querySelectorAll('.row-response');
            
            for(let i=0; i<triggers.length; i++) {
                if (triggers[i].value.trim() && responses[i].value.trim()) {
                    rows.push({ q: triggers[i].value.trim(), a: responses[i].value.trim() });
                }
            }

            if (rows.length === 0) return alert('يجب إضافة سؤال واحد على الأقل.');

            // Parse Context
            const matchedGrade = GRADES.find(g => currentContext.startsWith(g.id));
            if (!matchedGrade) return alert('خطأ في تحديد المادة.');
            const subjectId = currentContext.replace(matchedGrade.id + '_', '');

            saveBtn.disabled = true;
            saveBtn.classList.add('opacity-75');
            saveIcon.innerText = '⏳';

            const payload = {
                grade_id: matchedGrade.id,
                term_id: termId,
                subject_id: subjectId,
                type: type,
                title: title,
                order_index: parseInt(orderIndex),
                content: { blocks: rows },
                created_by: currentUser.id
            };

            try {
                const { error } = await supabase.from('tb_lessons').insert([payload]);
                if (error) throw error;
                alert('تم حفظ الدرس بنجاح! 🎉');
                // Reset basic fields
                document.getElementById('lessonTitle').value = '';
                document.getElementById('linksContainer').innerHTML = '';
            } catch (err) {
                console.error(err);
                alert('حدث خطأ أثناء الحفظ.');
            } finally {
                saveBtn.disabled = false;
                saveBtn.classList.remove('opacity-75');
                saveIcon.innerText = '💾';
            }
        };

        // ==========================================
        // GRADEBOOK FUNCTIONS
        // ==========================================
        window.loadGradebook = async () => {
            const tbody = document.getElementById('tableBody');
            const theadRow = document.getElementById('tableHeaderRow');
            const subtitle = document.getElementById('gradebookSubtitle');
            
            if (!currentContext) {
                tbody.innerHTML = '<tr><td colspan="100" class="p-8 text-center text-red-500">اختر مادة أولاً</td></tr>';
                return;
            }

            // UI Updates
            const contextName = document.getElementById('context-select').options[document.getElementById('context-select').selectedIndex].text;
            subtitle.innerText = contextName;
            document.getElementById('printContextTitle').innerText = contextName;
            document.getElementById('printDate').innerText = new Date().toLocaleDateString('ar-EG');
            tbody.innerHTML = '<tr><td colspan="100" class="p-8 text-center">جاري تحميل البيانات... ⏳</td></tr>';

            // Parse Context
            const matchedGrade = GRADES.find(g => currentContext.startsWith(g.id));
            const subjectId = currentContext.replace(matchedGrade.id + '_', '');

            try {
                // 1. Fetch Lessons (Columns)
                const { data: lessons, error: lErr } = await supabase
                    .from('tb_lessons')
                    .select('id, title, type')
                    .eq('grade_id', matchedGrade.id)
                    .eq('subject_id', subjectId)
                    .order('order_index');
                if (lErr) throw lErr;

                // 2. Fetch Students (Rows)
                const { data: allStudents, error: sErr } = await supabase
                    .from('tb_users')
                    .select('id, real_name, subscriptions')
                    .eq('role', 'student')
                    .order('real_name');
                if (sErr) throw sErr;

                // Filter students strictly by subscription to this grade_subject
                const classStudents = allStudents.filter(s => s.subscriptions && s.subscriptions[currentContext]);

                if (classStudents.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="100" class="p-8 text-center">لا يوجد طلاب مشتركين في هذه المادة.</td></tr>';
                    return;
                }

                // 3. Fetch Progress (Cells)
                const sIds = classStudents.map(s => s.id);
                const lIds = lessons.map(l => l.id);
                
                const { data: progress, error: pErr } = await supabase
                    .from('tb_progress')
                    .select('user_id, lesson_id, score')
                    .in('user_id', sIds)
                    .in('lesson_id', lIds);
                if (pErr) throw pErr;

                // 4. Render Table
                // Header
                theadRow.innerHTML = `
                    <th class="sticky right-0 bg-indigo-50 font-bold min-w-[150px] text-right pr-4 border-l">اسم الطالب</th>
                    <th class="text-center w-20 border-l">المجموع %</th>
                `;
                lessons.forEach((lesson, i) => {
                    const icon = lesson.type === 'lesson' ? '⭐' : (lesson.type === 'revision' ? '🔮' : '💎');
                    const th = document.createElement('th');
                    th.className = "text-center min-w-[80px] border-l";
                    th.innerHTML = `
                        <div class="text-[10px] text-gray-400">#${i + 1}</div>
                        <div class="text-xs w-20 mx-auto truncate" title="${lesson.title}">${lesson.title}</div>
                        <div class="text-[10px]">${icon}</div>
                    `;
                    theadRow.appendChild(th);
                });

                // Body
                tbody.innerHTML = '';
                classStudents.forEach(student => {
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-indigo-50 transition";
                    
                    const sProg = progress.filter(p => p.user_id === student.id);
                    const totalScore = sProg.reduce((sum, p) => sum + (p.score || 0), 0);
                    const max = lessons.length * 100;
                    const pct = max > 0 ? Math.round((totalScore/max)*100) : 0;

                    let rowHtml = `
                        <td class="sticky right-0 bg-white font-bold text-gray-800 pr-4 border-l border-gray-100 shadow-sm">${student.real_name || 'بدون اسم'}</td>
                        <td class="text-center font-bold text-brand border-l border-gray-100 bg-gray-50">${pct}%</td>
                    `;

                    lessons.forEach(lesson => {
                        const p = sProg.find(x => x.lesson_id === lesson.id);
                        let cell = '<span class="text-gray-300">-</span>';
                        if (p) {
                            const color = p.score >= 50 ? 'text-green-600' : 'text-red-400';
                            cell = `<span class="font-bold ${color}">${p.score}</span>`;
                        }
                        rowHtml += `<td class="text-center border-l border-gray-100">${cell}</td>`;
                    });

                    tr.innerHTML = rowHtml;
                    tbody.appendChild(tr);
                });

            } catch (err) {
                console.error(err);
                tbody.innerHTML = '<tr><td colspan="100" class="p-8 text-center text-red-500">خطأ في تحميل البيانات</td></tr>';
            }
        };

        window.kickOut = () => window.location.href = 'index.html';
        window.logout = () => { localStorage.removeItem('tb_user'); window.location.href = 'index.html'; };
        window.exportCSV = () => alert('قريباً: تصدير ملف Excel');
    </script>
</body>
</html>
