<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - المدرّس الشقي</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- LOAD THE CONNECTION HERE -->
    <script src="init.js"></script> 

    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden border-4 border-white transform transition-all hover:scale-[1.01]">
        <div class="bg-indigo-600 p-8 text-center">
            <h1 class="text-3xl font-black text-white tracking-wide">🦊 المدرّس الشقي</h1>
            <p class="text-indigo-200 text-sm mt-2">منصتك التعليمية الأولى</p>
        </div>

        <div class="p-8">
            <form id="loginForm" class="space-y-6">
                <div id="errorMessage" class="hidden bg-red-50 text-red-700 p-3 rounded text-sm font-bold text-center"></div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">كود الطالب</label>
                    <input type="text" id="access_code" placeholder="admin / teacher / student" required class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">كلمة السر</label>
                    <input type="password" id="password" placeholder="••••••••" required class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 outline-none">
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-lg">دخول</button>
            </form>

            <div class="mt-8 text-center border-t border-gray-100 pt-6">
                <p class="text-xs text-gray-400">Developed by <span class="text-indigo-500 font-bold">Abd-Alrahman.Gamal</span></p>
            </div>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const errorDiv = document.getElementById('errorMessage');
        const submitBtn = document.getElementById('submitBtn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = 'جاري التحقق...';
            errorDiv.classList.add('hidden');

            const accessCode = document.getElementById('access_code').value.trim();
            const password = document.getElementById('password').value.trim();

            try {
                // NOTICE: We use window.supabaseClient now (from init.js)
                const { data, error } = await window.supabaseClient
                    .from('tb_users')
                    .select('*')
                    .eq('access_code', accessCode)
                    .eq('password', password)
                    .maybeSingle();

                if (error) throw error;

                if (!data) {
                    showError('بيانات الدخول غير صحيحة.');
                } else {
                    localStorage.setItem('tb_user', JSON.stringify(data));
                    if (data.role === 'admin') window.location.href = 'admin.html';
                    else if (data.role === 'teacher') window.location.href = 'teacher.html';
                    else if (data.role === 'student') window.location.href = 'dashboard.html';
                }
            } catch (err) {
                console.error(err);
                showError('حدث خطأ في الاتصال.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'دخول';
            }
        });

        function showError(msg) {
            errorDiv.textContent = msg;
            errorDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
